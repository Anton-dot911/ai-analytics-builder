<head>

<link rel="manifest" href="manifest.json"><title>AI Analytics Builder</title>
<style>
:root{--bg:#080c14;--panel:#0f1725;--panel2:#121d2d;--card:#162235;--hover:#1b2a40;--line:#22334b;--text:#edf4ff;--muted:#8ea1b8;--dim:#52647b;--cyan:#38bdf8;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;--radius:12px;--sidebar:270px}*{box-sizing:border-box}html,body,#root{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100%;display:flex;overflow:hidden}.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:18px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#075985,#0ea5e9);display:grid;place-items:center;font-weight:900}.brand b{font-size:15px}.brand small{display:block;color:var(--cyan);font-size:9px;letter-spacing:1.3px;margin-top:2px;text-transform:uppercase}.nav{padding:12px 10px;display:grid;gap:4px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:var(--card);border-color:var(--line);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.nav span{margin-right:8px}.side-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:62px;border-bottom:1px solid var(--line);background:rgba(15,23,37,.92);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.title{font-weight:700}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 11px;border-radius:8px}.btn:hover{border-color:var(--cyan);color:var(--text)}.btn.primary{background:#075985;border-color:#0ea5e9;color:white}.btn.danger{color:#fca5a5}.content{flex:1;overflow:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--cyan);font-weight:700;margin-bottom:8px}.h1{font-size:26px;font-weight:800;letter-spacing:-.5px}.lead{color:var(--muted);line-height:1.6;max-width:760px}.section-title{font-weight:750;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px}.stat .n{font-size:20px;font-weight:800}.stat .l{font-size:10px;color:var(--muted);margin-top:3px}.progress{height:6px;background:#0a1220;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:8px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:9px}.row .meta{color:var(--muted);font-size:11px}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:3px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.b-green{background:#0d2a1b;color:#67e8a2}.b-amber{background:#2b210b;color:#fcd34d}.b-blue{background:#0b2635;color:#7dd3fc}.b-purple{background:#201633;color:#c4b5fd}.form{display:grid;gap:10px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.input,.textarea,.select{width:100%;background:#0b1320;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;outline:none}.textarea{min-height:130px;resize:vertical}.input:focus,.textarea:focus{border-color:var(--cyan)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px}.chat{height:100%;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:22px;display:grid;align-content:start;gap:14px}.msg{max-width:880px;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);line-height:1.6;white-space:pre-wrap}.msg.user{margin-left:auto;background:#102b49;border-color:#1d5a89}.msg.system{margin:0 auto;background:#101a28;color:var(--muted);font-size:12px}.composer{padding:14px 20px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:8px}.composer textarea{flex:1;min-height:48px;max-height:140px;resize:none}.empty{min-height:420px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.danger-note{border-left:3px solid var(--amber);padding:9px 12px;background:#19150b;color:#d6c18b;font-size:12px}.check{color:var(--green)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.roadmap{display:grid;gap:8px}.phase{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center}.phase .line{height:1px;background:var(--line)}.file{display:flex;justify-content:space-between;align-items:center}.drop{border:1px dashed #31506d;border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#0b1320}.drop:hover{border-color:var(--cyan)}@media(max-width:900px){:root{--sidebar:76px}.brand b,.brand small,.nav .txt,.side-bottom{display:none}.nav button{text-align:center}.span-8,.span-4,.span-6{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:14px}}@media(max-width:600px){.topbar{padding:0 12px}.content{padding:10px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.actions .btn:nth-child(n+3){display:none}}
</style>
</head>
